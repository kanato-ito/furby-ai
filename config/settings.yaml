gemini:
  model: gemini-3.6-flash        # 有料枠。3.8-flash は同料金で少し賢いが応答が約2秒遅い
  thinking_level: minimal         # minimal / low / medium / high（3.8-flash は low 以上）。低いほど速い
  google_search: true             # 天気・ニュースなど最新情報を検索して答える（月5,000回まで無料）
  max_history: 20
  timeout_sec: 20                 # 検索を使うと5秒以上かかることがある
  max_retries: 3

user:
  location: ""                    # 例: 東京都世田谷区。天気などで場所の指定がないときに使う
                                  # 公開リポジトリに載せたくない場合は設定ページか .env の FURBY_LOCATION で設定する
# 設定ページで変更した値は config/local.yaml（git 管理外）に保存され、このファイルより優先される

audio:
  sample_rate: 16000
  channels: 1
  vad_mode: 3                  # 0〜3。高いほどノイズに厳しい
  silence_duration_ms: 300      # この長さの無音で話し終わりと判断。長いほど途中で切れにくいが反応が遅い
  min_speech_duration_ms: 800  # 短い録音（ノイズ起因）を弾く
  volume_percent: null         # 0〜100。null なら OS の音量（amixer PCM）を変更しない

stt:
  model: whisper-large-v3-turbo  # Groq: 216x実時間・無料枠2000req/日
  language: ja

tts:
  voice: voicevox:3  # ja-JP-NanamiNeural など（edge-tts）か voicevox:<話者ID>（3 = ずんだもん ノーマル）
  voicevox_url: ""   # VOICEVOX エンジンを動かしている PC。例: http://my-mac.local:50021（設定ページでも変更可）
  fallback_voice: ja-JP-NanamiNeural  # VOICEVOX につながらないときの声
  rate_percent: 0    # 話す速さ（-50〜+100）
  pitch_hz: 0        # 声の高さ（-50〜+100）

motor:
  pin: 17
  pulse_on_ms: 300   # ON時間（口を開ける）
  pulse_off_ms: 2000  # OFF時間（口を閉じる）

startup:
  greeting: おはよう！話しかけてね    # 起動が終わったら話す。聞こえたら話しかけてよい合図。空なら話さない
  offline_message: インターネット接続を確認してね  # あいさつを合成できないときに流す

web:
  port: 8080         # 設定ページ http://furby-ai.local:8080 （.env の FURBY_WEB_PASSWORD が必要）

paths:
  db: data/conversations.db
  persona: config/persona.txt
  offline_sound: data/offline      # offline_message の音声（拡張子は声に合わせて付く）。ネットにつながったときに作っておく
  error_sound: sounds/error.wav
  tts_output: /tmp/furby_response.mp3
