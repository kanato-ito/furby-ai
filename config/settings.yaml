gemini:
  model: gemini-3.8-flash        # 有料枠。速さ優先なら gemini-3.5-flash-lite
  thinking_level: low             # 3.8-flash は low / medium / high。低いほど速い
  google_search: true             # 天気・ニュースなど最新情報を検索して答える（月5,000回まで無料）
  max_history: 20
  timeout_sec: 20                 # 検索を使うと5秒以上かかることがある
  max_retries: 3

user:
  location: ""                    # 例: 東京都世田谷区。天気などで場所の指定がないときに使う

audio:
  sample_rate: 16000
  channels: 1
  vad_mode: 3                  # 0〜3。高いほどノイズに厳しい
  silence_duration_ms: 800
  min_speech_duration_ms: 800  # 短い録音（ノイズ起因）を弾く

stt:
  model: whisper-large-v3-turbo  # Groq: 216x実時間・無料枠2000req/日
  language: ja

tts:
  voice: ja-JP-NanamiNeural

motor:
  pin: 17
  pulse_on_ms: 300   # ON時間（口を開ける）
  pulse_off_ms: 2000  # OFF時間（口を閉じる）

paths:
  db: data/conversations.db
  persona: config/persona.txt
  startup_sound: sounds/startup.wav
  error_sound: sounds/error.wav
  tts_output: /tmp/furby_response.mp3
